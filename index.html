<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Site em manutenção | BBG Confecções</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #F7F8FA;
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      border-top: 6px solid #0D63FF;
    }
    .card img { max-width: 180px; height: auto; margin-bottom: 2rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
    p { color: #6B7280; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #0D63FF;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: .8rem 1.75rem;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(13,99,255,.28);
      transition: background 250ms ease;
    }
    .btn:hover { background: #0A4FCC; }
    .contact { margin-top: 1.75rem; font-size: .9rem; color: #6B7280; }
    .contact a { color: #0D63FF; text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="BBG Confecções" />
    <h1>Site em manutenção</h1>
    <p>Estamos realizando melhorias para oferecer uma experiência ainda melhor. Voltamos em breve!</p>
    <a class="btn" href="https://wa.me/5511965724862?text=Olá!%20Gostaria%20de%20solicitar%20um%20orçamento."
       target="_blank" rel="noopener noreferrer">Fale conosco pelo WhatsApp</a>
    <div class="contact">
      <a href="tel:+5511965724862">(11) 96572-4862</a> &middot;
      <a href="mailto:comercial@grupobbg.com.br">comercial@grupobbg.com.br</a>
    </div>
  </main>
</body>
</html>
